name: Auto Deploy to CloudFly

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH and Update Code on CloudFly
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /root/megabot-server
            git fetch --all
            git checkout main 2>/dev/null || git checkout master 2>/dev/null || true
            git reset --hard origin/main 2>/dev/null || git pull origin main 2>/dev/null || git pull origin master 2>/dev/null || true
            chmod +x setup_and_run.sh
            ./setup_and_run.sh