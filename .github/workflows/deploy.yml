name: Auto Deploy to CloudFly

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Run WebSocket on CloudFly
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            mkdir -p /root/megabot-server
            cd /root/megabot-server
            
            # Cấu hình SSH sử dụng khóa github_deploy để kéo code từ GitHub
            export GIT_SSH_COMMAND="ssh -i /root/.ssh/github_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
            
            if [ ! -d ".git" ]; then
              git init
              git remote add origin git@github.com:megadinhai/Robot_megabot.git
            else
              git remote set-url origin git@github.com:megadinhai/Robot_megabot.git
            fi
            
            git fetch --all
            git reset --hard origin/main
            sed -i 's/\r$//' setup_and_run.sh
            chmod +x setup_and_run.sh
            ./setup_and_run.sh
